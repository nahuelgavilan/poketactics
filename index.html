<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Mobile viewport optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA & Mobile App meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PokéTactics" />
    <meta name="application-name" content="PokéTactics" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO -->
    <title>PokéTactics</title>
    <meta name="description" content="Juego táctico por turnos estilo Advance Wars con Pokémon, optimizado para móvil y listo para instalar como PWA." />

    <!-- Open Graph -->
    <meta property="og:title" content="PokéTactics" />
    <meta property="og:description" content="Juego táctico por turnos con Pokémon optimizado para móvil y PWA" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
